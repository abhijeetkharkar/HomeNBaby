AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub Actions OIDC Provider and Deployment Role for HomeNBaby'

Parameters:
  GitHubOrg:
    Type: String
    Default: 'abhijeetkharkar'
    Description: 'GitHub Organization or Username'

  RepositoryName:
    Type: String
    Default: 'HomeNBaby'
    Description: 'GitHub Repository Name'

  RoleName:
    Type: String
    Default: 'HomeNBaby-GitHubActions-DeployRole'
    Description: 'IAM Role Name for GitHub Actions'

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: 'https://token.actions.githubusercontent.com'
      ClientIdList:
        - 'sts.amazonaws.com'
      ThumbprintList:
        - '6938fd4d98bab03faadb97b34396831e3780aea1'

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: 'IAM role assumed by GitHub Actions for deploying HomeNBaby monorepo stacks'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${RepositoryName}:*'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AdministratorAccess'
      Tags:
        - Key: Repository
          Value: !Sub '${GitHubOrg}/${RepositoryName}'
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RoleArn:
    Description: 'ARN of the IAM Role for GitHub Actions'
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'
