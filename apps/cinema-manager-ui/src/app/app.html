<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-section">
        <div class="brand-icon">
          <mat-icon>local_movies</mat-icon>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Cinema<span>Manager</span></h1>
          <span class="brand-subtitle">Home Theater & Media Library</span>
        </div>
      </div>

      <!-- User Auth Section in Header -->
      <div class="header-actions">
        <button mat-button class="btn-setup" *ngIf="authService.isAuthenticated()" (click)="openOnboarding()">
          <mat-icon>phonelink_setup</mat-icon>
          <span>Pair Agent</span>
        </button>

        <div class="user-pill" *ngIf="authService.isAuthenticated()">
          <mat-icon>account_circle</mat-icon>
          <span class="user-email">{{ authService.currentUser()?.email }}</span>
          <button mat-icon-button class="btn-logout" (click)="onSignOut()" title="Sign Out">
            <mat-icon>logout</mat-icon>
          </button>
        </div>

        <button mat-flat-button class="btn-signin" *ngIf="!authService.isAuthenticated()" (click)="onSignIn()">
          <mat-icon>login</mat-icon>
          <span>Sign In</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="content-container">
      <!-- Unauthenticated Visitors see Showcase Landing Page -->
      <app-showcase-landing
        *ngIf="!authService.isAuthenticated() && !isExploringDemo"
        (exploreDemo)="isExploringDemo = true"
      ></app-showcase-landing>

      <!-- Authenticated Users (or Demo Explorers) see Cinema Gallery -->
      <router-outlet *ngIf="authService.isAuthenticated() || isExploringDemo"></router-outlet>
    </div>
  </main>

  <!-- Onboarding Wizard Modal -->
  <app-onboarding-wizard
    *ngIf="showOnboarding"
    (completed)="closeOnboarding()"
  ></app-onboarding-wizard>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; {{ currentYear }} Cinema Manager &bull; Powered by NestJS, DynamoDB & Angular</p>
    </div>
  </footer>
</div>
