<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <a [routerLink]="authService.isAuthenticated() ? '/dashboard' : '/'" class="brand-section">
        <div class="brand-icon">
          <mat-icon>local_movies</mat-icon>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">Cinema<span>Manager</span></h1>
          <span class="brand-subtitle">Home Theater & Media Library</span>
        </div>
      </a>

      <!-- User Auth Section in Header -->
      <div class="header-actions">
        <!-- If Authenticated -->
        <ng-container *ngIf="authService.isAuthenticated()">
          <a routerLink="/dashboard" routerLinkActive="nav-active" class="nav-link-btn">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>

          <button mat-button class="btn-setup" (click)="openOnboarding()">
            <mat-icon>phonelink_setup</mat-icon>
            <span>Pair Agent</span>
          </button>

          <div class="user-pill">
            <mat-icon>account_circle</mat-icon>
            <span class="user-email">{{ authService.currentUser()?.email }}</span>
            <button mat-icon-button class="btn-logout" (click)="onSignOut()" title="Sign Out">
              <mat-icon>logout</mat-icon>
            </button>
          </div>
        </ng-container>

        <!-- If Unauthenticated -->
        <ng-container *ngIf="!authService.isAuthenticated()">
          <a routerLink="/login" class="btn-signin mat-flat-button">
            <mat-icon>login</mat-icon>
            <span>Sign In</span>
          </a>
        </ng-container>
      </div>
    </div>
  </header>

  <!-- Main Content Area with Dynamic Router Outlet -->
  <main class="main-content">
    <div class="content-container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Onboarding Wizard Modal -->
  <app-onboarding-wizard
    *ngIf="showOnboarding"
    (completed)="closeOnboarding()"
  ></app-onboarding-wizard>

  <!-- Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; {{ currentYear }} Cinema Manager &bull; Powered by NestJS, DynamoDB & Angular</p>
    </div>
  </footer>
</div>
