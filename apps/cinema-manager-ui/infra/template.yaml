AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cinema Manager UI - S3 & CloudFront Distribution (cinema.abhijeetkharkar.com)'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: 'Deployment environment'

  DomainName:
    Type: String
    Default: 'cinema.abhijeetkharkar.com'
    Description: 'Domain name for cinema manager UI'

  HostedZoneId:
    Type: String
    Default: 'Z13Z70GHALBE08'
    Description: 'Route 53 Hosted Zone ID for abhijeetkharkar.com'

  CertificateArn:
    Type: String
    Default: 'arn:aws:acm:us-east-1:797884421713:certificate/15b73dd4-bcb8-4f54-b9a4-7dc728ed2727'
    Description: 'ACM Wildcard Certificate ARN in us-east-1'

Resources:
  # ── S3 Bucket for Cinema Manager Angular Frontend ─────────────────────────
  CinemaUiBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cinema-manager-ui-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: App
          Value: cinema-manager-ui
        - Key: Environment
          Value: !Ref Environment

  # ── Origin Access Control (OAC) ──────────────────────────────────────────
  CinemaUiOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'cinema-ui-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 Bucket Policy for CloudFront OAC Access ───────────────────────────
  CinemaUiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CinemaUiBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${CinemaUiBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CinemaUiDistribution}'

  # ── CloudFront Distribution (cinema.abhijeetkharkar.com) ─────────────────
  CinemaUiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt CinemaUiBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CinemaUiOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: App
          Value: cinema-manager-ui
        - Key: Environment
          Value: !Ref Environment

  CinemaUiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CinemaUiDistribution.DomainName

Outputs:
  CinemaUiBucketName:
    Description: 'Cinema Manager UI S3 Bucket Name'
    Value: !Ref CinemaUiBucket
    Export:
      Name: !Sub '${AWS::StackName}-Bucket'

  CinemaUiDistributionId:
    Description: 'Cinema Manager UI CloudFront Distribution ID'
    Value: !Ref CinemaUiDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  SiteUrl:
    Description: 'Cinema Manager UI URL'
    Value: !Sub 'https://${DomainName}'
