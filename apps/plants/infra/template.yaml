AWSTemplateFormatVersion: '2010-09-09'
Description: 'Plants Application - S3, CloudFront & DynamoDB Infrastructure'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: 'Deployment environment'

  DomainName:
    Type: String
    Default: 'plants.abhijeetkharkar.com'
    Description: 'Domain name for plants app'

  HostedZoneId:
    Type: String
    Default: 'Z13Z70GHALBE08'
    Description: 'Route 53 Hosted Zone ID for abhijeetkharkar.com'

  CertificateArn:
    Type: String
    Default: 'arn:aws:acm:us-east-1:797884421713:certificate/15b73dd4-bcb8-4f54-b9a4-7dc728ed2727'
    Description: 'ACM Wildcard Certificate ARN in us-east-1'

Resources:


  # ── S3 Bucket for Plants Static Assets ───────────────────────────────────
  PlantsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'plants-frontend-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: App
          Value: plants
        - Key: Environment
          Value: !Ref Environment

  # ── Origin Access Control (OAC) ──────────────────────────────────────────
  PlantsOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'plants-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── S3 Bucket Policy for CloudFront OAC Access ───────────────────────────
  PlantsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PlantsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PlantsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${PlantsDistribution}'

  # ── CloudFront Distribution (plants.abhijeetkharkar.com) ─────────────────
  PlantsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt PlantsBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PlantsOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: App
          Value: plants
        - Key: Environment
          Value: !Ref Environment

  PlantsDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt PlantsDistribution.DomainName

Outputs:
  PlantsBucketName:
    Description: 'Plants S3 Bucket Name'
    Value: !Ref PlantsBucket
    Export:
      Name: !Sub '${AWS::StackName}-Bucket'

  PlantsDistributionId:
    Description: 'Plants CloudFront Distribution ID'
    Value: !Ref PlantsDistribution
    Export:
      Name: !Sub '${AWS::StackName}-DistributionId'

  SiteUrl:
    Description: 'Plants App URL'
    Value: !Sub 'https://${DomainName}'
