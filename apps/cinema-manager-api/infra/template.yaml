AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cinema Manager API - DynamoDB Tables & NestJS Lambda Backend'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    Description: 'Deployment environment'

  ProjectName:
    Type: String
    Default: 'cinema-manager'
    Description: 'Project name prefix'

  TmdbApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'The Movie Database (TMDB) API Key'

  OmdbApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: 'Open Movie Database (OMDB) API Key'


Resources:
  # ── 1. DynamoDB Tables ───────────────────────────────────────────────────
  MoviesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-movies'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
        - AttributeName: title
          AttributeType: S
        - AttributeName: year
          AttributeType: N
        - AttributeName: genre
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TitleYearIndex
          KeySchema:
            - AttributeName: title
              KeyType: HASH
            - AttributeName: year
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GenreIndex
          KeySchema:
            - AttributeName: genre
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  AgentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-agents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: agentId
          AttributeType: S
        - AttributeName: agentName
          AttributeType: S
      KeySchema:
        - AttributeName: agentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AgentNameIndex
          KeySchema:
            - AttributeName: agentName
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  LookupPathsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-lookup-paths'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: N
        - AttributeName: path
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: PathIndex
          KeySchema:
            - AttributeName: path
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  MasterMoviesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-master-movies'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: canonicalKey
          AttributeType: S
      KeySchema:
        - AttributeName: canonicalKey
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  PairingCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-pairing-codes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  AuditLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-audit-logs'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  # ── 2. Cognito Authentication ────────────────────────────────────────────
  CinemaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        App: cinema-manager
        Environment: !Ref Environment

  CinemaCognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'cinema-abhijeetkharkar-${Environment}'
      UserPoolId: !Ref CinemaUserPool

  CinemaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web-client-${Environment}'
      UserPoolId: !Ref CinemaUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - 'https://cinema.abhijeetkharkar.com/'
        - 'http://localhost:4200/'
      LogoutURLs:
        - 'https://cinema.abhijeetkharkar.com/'
        - 'http://localhost:4200/'

  # ── 3. IAM Role for Cinema API Lambda ────────────────────────────────────
  CinemaApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-api-lambda-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt MoviesTable.Arn
                  - !Sub '${MoviesTable.Arn}/index/*'
                  - !GetAtt AgentsTable.Arn
                  - !Sub '${AgentsTable.Arn}/index/*'
                  - !GetAtt UsersTable.Arn
                  - !Sub '${UsersTable.Arn}/index/*'
                  - !GetAtt LookupPathsTable.Arn
                  - !Sub '${LookupPathsTable.Arn}/index/*'
                  - !GetAtt MasterMoviesTable.Arn
                  - !Sub '${MasterMoviesTable.Arn}/index/*'
                  - !GetAtt PairingCodesTable.Arn
                  - !Sub '${PairingCodesTable.Arn}/index/*'
                  - !GetAtt AuditLogsTable.Arn
                  - !Sub '${AuditLogsTable.Arn}/index/*'
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

  # ── 4. Lambda Function for Cinema API ────────────────────────────────────
  CinemaApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api-${Environment}'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt CinemaApiLambdaRole.Arn
      MemorySize: 512
      Timeout: 15
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return { statusCode: 200, body: JSON.stringify({ message: "Cinema API Initializing" }) };
          };
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          MOVIES_TABLE: !Ref MoviesTable
          AGENTS_TABLE: !Ref AgentsTable
          USERS_TABLE: !Ref UsersTable
          LOOKUP_PATHS_TABLE: !Ref LookupPathsTable
          MASTER_MOVIES_TABLE: !Ref MasterMoviesTable
          PAIRING_CODES_TABLE: !Ref PairingCodesTable
          AUDIT_LOGS_TABLE: !Ref AuditLogsTable
          USER_POOL_ID: !Ref CinemaUserPool
          USER_POOL_CLIENT_ID: !Ref CinemaUserPoolClient
          TMDB_API_KEY: !Ref TmdbApiKey
          OMDB_API_KEY: !Ref OmdbApiKey
      Tags:
        - Key: App
          Value: cinema-manager-api
        - Key: Environment
          Value: !Ref Environment

Outputs:
  CinemaApiLambdaName:
    Description: 'Cinema API Lambda Function Name'
    Value: !Ref CinemaApiLambda
    Export:
      Name: !Sub '${AWS::StackName}-LambdaName'

  CinemaApiLambdaArn:
    Description: 'Cinema API Lambda ARN'
    Value: !GetAtt CinemaApiLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  MoviesTableName:
    Description: 'Movies Table Name'
    Value: !Ref MoviesTable
    Export:
      Name: !Sub '${AWS::StackName}-MoviesTable'

  MasterMoviesTableName:
    Description: 'Master Movies Cache Table Name'
    Value: !Ref MasterMoviesTable
    Export:
      Name: !Sub '${AWS::StackName}-MasterMoviesTable'

  PairingCodesTableName:
    Description: 'Pairing Codes Table Name'
    Value: !Ref PairingCodesTable
    Export:
      Name: !Sub '${AWS::StackName}-PairingCodesTable'

  AuditLogsTableName:
    Description: 'Audit Logs Table Name'
    Value: !Ref AuditLogsTable
    Export:
      Name: !Sub '${AWS::StackName}-AuditLogsTable'

  CinemaUserPoolId:
    Description: 'Cinema Cognito User Pool ID'
    Value: !Ref CinemaUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  CinemaUserPoolClientId:
    Description: 'Cinema Cognito User Pool Client ID'
    Value: !Ref CinemaUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CinemaCognitoDomain:
    Description: 'Cinema Cognito Hosted UI Domain'
    Value: !Sub '${CinemaCognitoDomain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDomain'


