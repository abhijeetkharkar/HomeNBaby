name: Deploy Plants API

# Manual only until the plants frontend is cut over to this API.
# At cutover, add a push trigger (branches: main, paths: apps/plants-api/**).
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Plants API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --workspace plants-api

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::797884421713:role/HomeNBaby-GitHubActions-DeployRole
          aws-region: us-east-1

      - name: Make deploy script executable
        run: chmod +x ./apps/plants-api/infra/deploy.sh

      - name: Deploy Plants API
        shell: bash
        run: ./apps/plants-api/infra/deploy.sh prod us-east-1 none
